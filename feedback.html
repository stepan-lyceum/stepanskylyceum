<main class="main-body">
    <section class="content-card">
        <h2>Зворотній зв'язок</h2>
        <form action="https://formspree.io/f/xnjyggya" method="POST">
            <input type="hidden" name="_subject" value="Нове повідомлення з сайту ліцею">
            <div class="form-group"><label>Ваше ім'я:</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Email:</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Повідомлення:</label><textarea name="message" rows="5" required></textarea></div>
            <button type="submit">Надіслати</button>
        </form>
    </section>
</main>
